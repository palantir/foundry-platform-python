palantir_aliases:
  - &always-run
    filters:
      branches:
        only: /.*/
      tags:
        only: /.*/

version: 2.1

commands:
  setup-npm-project:
    description: "Setup npm project - checkout code, set version, install dependencies and build"
    steps:
      - checkout
      - run: node scripts/set_npm_version.js
      - run:
          name: Install npm dependencies and build
          command: |
            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"
            cd docs-snippets-npm
            npm install
            npm run build

jobs:
  test:
    parameters:
      python_version:
        type: string
      pydantic_version:
        type: string
      httpx_version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python_version >>
    steps:
      - checkout
      - run: pip install --user tox
      - run: poetry --no-ansi install --no-root --sync
      - run: |
          PYDANTIC_VERSION=<< parameters.pydantic_version >>.* \
          HTTPX_VERSION=<< parameters.httpx_version >>.* \
          poetry --no-ansi run tox -v -e py<< parameters.python_version >> --recreate

  black:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: pip install --user tox
      - run: python -m tox -e black

  npm-build:
    parameters:
      node_version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node_version >>
    steps:
      - setup-npm-project
      - run:
          name: Echo build completion
          command: echo "Completed building docs-snippets-npm on Node.js << parameters.node_version >>"

  npm-pack-dry-run:
    parameters:
      node_version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node_version >>
    steps:
      - setup-npm-project
      - run:
          name: Run npm pack dry-run
          command: |
            cd docs-snippets-npm
            npm pack --dry-run

  npm-publish:
    docker:
      - image: cimg/node:23
    steps:
      - setup-npm-project
      - run:
          name: Publish npm package
          command: |
            cd docs-snippets-npm
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm publish --access=public

  circle-all:
    docker:
      - image: node:lts
    steps:
      - run: echo "Done!"

  publish:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run: python scripts/set_python_version.py
      - run: poetry version $(git describe --tags --abbrev=0)
      - run: poetry publish -v -u $PYPI_USERNAME -p $PYPI_PASSWORD --build

workflows:
  version: 2
  build:
    jobs:
      - test:
          <<: *always-run
          name: python-<< matrix.python_version>>
          matrix:
            parameters:
              python_version: ["3.10", "3.11", "3.12", "3.13"]
              pydantic_version: ["2.12"]
              httpx_version: ["0.28"]
      - test:
          <<: *always-run
          name: pydantic-<< matrix.pydantic_version >>
          matrix:
            parameters:
              python_version: ["3.12"]
              pydantic_version: ["2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "2.12"]
              httpx_version: ["0.28"]
      - test:
          <<: *always-run
          name: httpx-<< matrix.httpx_version >>
          matrix:
            parameters:
              python_version: ["3.13"]
              pydantic_version: ["2.12"]
              httpx_version: ["0.25", "0.26", "0.27", "0.28"]
      - black:
          <<: *always-run
      - circle-all:
          <<: *always-run
          requires:
            - python-3.10
            - python-3.11
            - python-3.12
            - python-3.13

            - pydantic-2.6
            - pydantic-2.7
            - pydantic-2.8
            - pydantic-2.9
            - pydantic-2.10
            - pydantic-2.11
            - pydantic-2.12

            - httpx-0.25
            - httpx-0.26
            - httpx-0.27
            - httpx-0.28

            - black
            - npm-build-18.20
            - npm-build-20.19
            - npm-build-22.14
            - npm-pack-dry-run-18.20
            - npm-pack-dry-run-20.19
            - npm-pack-dry-run-22.14
      - publish:
          requires:
            - circle-all
          filters:
            tags: { only: '/^[0-9]+(\.[0-9]+)+(-[a-zA-Z]+[0-9]*)*$/' }
            branches: { ignore: /.*/ }
      - npm-publish:
          requires:
            - publish
            - npm-build-22.14
          filters:
            tags: { only: '/^[0-9]+(\.[0-9]+)+(-[a-zA-Z]+[0-9]*)*$/' }
            branches: { ignore: /.*/ }
      - npm-build:
          <<: *always-run
          name: npm-build-<< matrix.node_version >>
          matrix:
            parameters:
              node_version: ["18.20", "20.19", "22.14"]
      - npm-pack-dry-run:
          <<: *always-run
          name: npm-pack-dry-run-<< matrix.node_version >>
          matrix:
            parameters:
              node_version: ["18.20", "20.19", "22.14"]
          requires:
            - npm-build-<< matrix.node_version >>
